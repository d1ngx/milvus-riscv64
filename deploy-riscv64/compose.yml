services:
  etcd:
    container_name: milvus-etcd
    image: etcd:latest-riscv64
    restart: unless-stopped

    environment:
      ETCD_UNSUPPORTED_ARCH: riscv64
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"

    command:
      - --name=milvus-etcd
      - --data-dir=/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=milvus-etcd=http://etcd:2380
      - --initial-cluster-state=new

    ports:
      - "2379:2379"
      - "2380:2380"

    volumes:
      - ./volumes/etcd:/etcd

    healthcheck:
      test:
        - CMD
        - /usr/local/bin/etcdctl
        - --endpoints=http://127.0.0.1:2379
        - endpoint
        - health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    networks:
      - milvus

  minio:
    container_name: milvus-minio
    image: minio:RELEASE.2024-12-18T13-15-44Z-riscv64
    restart: unless-stopped

    user: "1000:1000"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    command:
      - server
      - /minio_data
      - --address
      - ":9000"
      - --console-address
      - ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - ./volumes/minio:/minio_data

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    networks:
      - milvus

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.20-riscv64
    restart: unless-stopped

    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

    environment:
      TZ: Asia/Shanghai

      ETCD_ENDPOINTS: etcd:2379

      MINIO_ADDRESS: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin

    command:
      - run
      - standalone

    ports:
      - "19530:19530"
      - "19529:19529"
      - "9091:9091"

    volumes:
      - ./volumes/milvus:/var/lib/milvus

    shm_size: "2gb"

    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      core:
        soft: -1
        hard: -1

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:9091/healthz
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

    networks:
      - milvus
    deploy:
      resources:
        limits:
          memory: 4096M  # 等价于 -m 4g
          cpus: '4.0'    # 等价于 --cpus=4

networks:
  milvus:
    name: milvus
    driver: bridge
